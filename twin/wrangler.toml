# Cloudflare Worker config for the Gargantua Twin backend.
# Deploy: npx wrangler deploy   (see README.md for the full runbook)

name = "gargantua-twin"
main = "worker.js"
compatibility_date = "2026-06-01"

# US-pinned egress relay. Anthropic returns 403 "Request not allowed" for API
# calls that leave Cloudflare from an unsupported region (e.g. Hong Kong, the
# colo nearest Bengaluru visitors). The AnthropicRelay Durable Object is created
# with a US location hint, so the outbound call to Anthropic always egresses
# from a supported region. (Smart Placement was tried first but doesn't relocate
# a low-traffic Worker reliably; the DO is deterministic.)
[[durable_objects.bindings]]
name = "ANTHROPIC_RELAY"
class_name = "AnthropicRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AnthropicRelay"]

# Model overrides (optional — code defaults to Haiku / Sonnet if unset).
[vars]
TWIN_MODEL_DEFAULT = "claude-haiku-4-5"
TWIN_MODEL_ESCALATE = "claude-sonnet-4-6"

# Per-IP rate limiting via Workers KV.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "e7858b1b6da247e8913f0947e69d25b9"

# ANTHROPIC_API_KEY is a SECRET, not a var. Never put it here. Set it with:
#   npx wrangler secret put ANTHROPIC_API_KEY
